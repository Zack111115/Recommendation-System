<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Hồ Sơ Khách Hàng – ShopNeo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
</head>
<body class="bg-gray-50 min-h-screen">

<!-- HEADER -->
<header class="bg-indigo-700 text-white shadow-lg sticky top-0 z-50">
  <div class="max-w-6xl mx-auto px-4 py-3 flex items-center gap-4">
    <a href="/" class="flex items-center gap-2 font-bold text-xl">
      <i class="fa-solid fa-store"></i> ShopNeo
    </a>
    <a href="/" class="text-indigo-200 hover:text-white text-sm">
      <i class="fa fa-arrow-left"></i> Quay lại
    </a>
  </div>
</header>

<div class="max-w-6xl mx-auto px-4 py-8">

  <!-- LOADING -->
  <div id="loadingState" class="text-center py-20 text-gray-400">
    <i class="fa fa-spinner fa-spin text-4xl"></i>
  </div>

  <div id="mainContent" class="hidden">

    <!-- CUSTOMER CARD -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6 flex items-center gap-6">
      <div class="w-20 h-20 bg-indigo-100 rounded-full flex items-center justify-center text-4xl text-indigo-600">
        <i class="fa fa-user"></i>
      </div>
      <div>
        <h1 id="custName" class="text-2xl font-bold text-gray-800"></h1>
        <p id="custEmail" class="text-gray-500 text-sm mt-1"></p>
        <div class="flex gap-3 mt-2">
          <span id="custId" class="text-xs bg-indigo-100 text-indigo-700 px-3 py-1 rounded-full font-mono font-semibold"></span>
          <span id="custGroup" class="text-xs bg-green-100 text-green-700 px-3 py-1 rounded-full"></span>
        </div>
      </div>
      <div class="ml-auto text-right">
        <p class="text-xs text-gray-400">Ngày tạo</p>
        <p id="custCreated" class="text-sm text-gray-600 font-medium"></p>
      </div>
    </div>

    <!-- STATS ROW -->
    <div class="grid grid-cols-3 gap-4 mb-6">
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p class="text-3xl font-extrabold text-indigo-700" id="statBought">-</p>
        <p class="text-sm text-gray-500 mt-1"><i class="fa fa-shopping-bag mr-1"></i>Lượt mua</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p class="text-3xl font-extrabold text-indigo-700" id="statViewed">-</p>
        <p class="text-sm text-gray-500 mt-1"><i class="fa fa-eye mr-1"></i>Lượt xem</p>
      </div>
      <div class="bg-white rounded-xl shadow p-4 text-center">
        <p class="text-3xl font-extrabold text-indigo-700" id="statOrders">-</p>
        <p class="text-sm text-gray-500 mt-1"><i class="fa fa-receipt mr-1"></i>Đơn hàng</p>
      </div>
    </div>

    <!-- TABS -->
    <div class="bg-white rounded-2xl shadow-lg overflow-hidden">
      <div class="flex border-b border-gray-200 px-4 pt-1">
        <button onclick="showTab('bought')" id="tab-btn-bought"
          class="tab-btn px-5 py-3 text-sm border-b-2 border-indigo-600 text-indigo-700 font-bold">
          <i class="fa fa-shopping-bag mr-1"></i> Lịch sử mua hàng
        </button>
        <button onclick="showTab('viewed')" id="tab-btn-viewed"
          class="tab-btn px-5 py-3 text-sm text-gray-500 border-b-2 border-transparent">
          <i class="fa fa-eye mr-1"></i> Sản phẩm đã xem
        </button>
        <button onclick="showTab('recommend')" id="tab-btn-recommend"
          class="tab-btn px-5 py-3 text-sm text-gray-500 border-b-2 border-transparent">
          <i class="fa fa-star mr-1"></i> Gợi ý cho bạn
        </button>
      </div>

      <!-- Bought tab -->
      <div id="tab-bought" class="p-5">
        <div id="boughtTable" class="overflow-x-auto">
          <table class="w-full text-sm">
            <thead>
              <tr class="border-b border-gray-100 text-left text-gray-500 text-xs uppercase">
                <th class="pb-2 pr-4">Đơn hàng</th>
                <th class="pb-2 pr-4">Sản phẩm</th>
                <th class="pb-2 pr-4">Danh mục</th>
                <th class="pb-2 pr-4 text-right">Đơn giá</th>
                <th class="pb-2 pr-4 text-center">SL</th>
                <th class="pb-2 text-right">Ngày mua</th>
              </tr>
            </thead>
            <tbody id="boughtBody" class="divide-y divide-gray-50"></tbody>
          </table>
        </div>
        <div id="boughtEmpty" class="hidden text-center py-8 text-gray-400">
          <i class="fa fa-box-open text-3xl mb-2"></i><p>Chưa có đơn hàng</p>
        </div>
      </div>

      <!-- Viewed tab -->
      <div id="tab-viewed" class="p-5 hidden">
        <div id="viewedGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
        <div id="viewedEmpty" class="hidden text-center py-8 text-gray-400">
          <i class="fa fa-eye-slash text-3xl mb-2"></i><p>Chưa xem sản phẩm nào</p>
        </div>
      </div>

      <!-- Recommend tab -->
      <div id="tab-recommend" class="p-5 hidden">
        <p class="text-xs text-gray-400 mb-4 flex items-center gap-1">
          <i class="fa fa-info-circle text-indigo-400"></i>
          <strong>Collaborative Filtering</strong>: Dựa trên lịch sử mua hàng của bạn và những người mua tương tự.
        </p>
        <div id="recommendGrid" class="grid grid-cols-2 md:grid-cols-4 gap-3"></div>
        <div id="recommendEmpty" class="hidden text-center py-8 text-gray-400">
          <p>Chưa có gợi ý</p>
        </div>
      </div>
    </div>

  </div>
</div>

<script>
const API = '';
const params = new URLSearchParams(location.search);
const customerId = params.get('id');

const EMOJIS = {
  'Laptop':'💻','Phụ kiện máy tính':'🖱️','Điện thoại':'📱',
  'Phụ kiện điện thoại':'🔋','Thiết bị âm thanh':'🎧','Đồ gia dụng':'🏠',
  'Chăm sóc em bé':'🍼','Đồ uống':'☕','Thể thao':'⚽',
  'Chăm sóc cá nhân':'🧴','Văn phòng phẩm':'📎','Đồ ăn nhẹ':'🍪'
};
function emoji(cat) {
  if (!cat) return '📦';
  for (const [k,v] of Object.entries(EMOJIS)) if (cat.includes(k)) return v;
  return '📦';
}

async function boot() {
  if (!customerId) { location.href='/'; return; }
  const [cust, hist, recs] = await Promise.all([
    fetch(`${API}/api/customers/${customerId}`).then(r => r.json()),
    fetch(`${API}/api/customers/${customerId}/history`).then(r => r.json()),
    fetch(`${API}/api/recommend/collaborative/${customerId}?limit=12`).then(r => r.json())
  ]);
  document.getElementById('loadingState').classList.add('hidden');
  document.getElementById('mainContent').classList.remove('hidden');

  // Customer info
  document.getElementById('custName').textContent = cust.name || cust.id;
  document.getElementById('custEmail').textContent = cust.email || '';
  document.getElementById('custId').textContent = cust.id;
  document.getElementById('custGroup').textContent = `Nhóm: ${cust.behaviorGroup || ''}`;
  document.getElementById('custCreated').textContent = (cust.createdAt || '').substring(0, 10);

  // Stats
  const orders = new Set(hist.bought.map(b => b.orderId)).size;
  document.getElementById('statBought').textContent = hist.bought.length;
  document.getElementById('statViewed').textContent = hist.viewed.length;
  document.getElementById('statOrders').textContent = orders;

  // Bought table
  if (!hist.bought.length) {
    document.getElementById('boughtEmpty').classList.remove('hidden');
    document.getElementById('boughtTable').classList.add('hidden');
  } else {
    const tbody = document.getElementById('boughtBody');
    hist.bought.forEach(b => {
      const date = (b.purchasedAt || '').substring(0, 10);
      const price = Number(b.price).toLocaleString('vi-VN');
      tbody.innerHTML += `
        <tr class="hover:bg-gray-50 cursor-pointer" onclick="location.href='/product?id=${b.productId}'">
          <td class="py-2.5 pr-4 font-mono text-xs text-indigo-600">${b.orderId}</td>
          <td class="py-2.5 pr-4">
            <div class="font-semibold text-gray-800">${b.productName}</div>
            <div class="text-xs text-gray-400">${b.brand || ''}</div>
          </td>
          <td class="py-2.5 pr-4 text-xs text-gray-500">${b.categoryName || ''}</td>
          <td class="py-2.5 pr-4 text-right text-indigo-700 font-semibold">${price}đ</td>
          <td class="py-2.5 pr-4 text-center text-gray-700">${b.quantity}</td>
          <td class="py-2.5 text-right text-xs text-gray-400">${date}</td>
        </tr>`;
    });
  }

  // Viewed grid
  if (!hist.viewed.length) {
    document.getElementById('viewedEmpty').classList.remove('hidden');
  } else {
    const vGrid = document.getElementById('viewedGrid');
    hist.viewed.forEach(v => {
      const price = Number(v.price).toLocaleString('vi-VN');
      const date = (v.viewedAt || '').substring(0, 10);
      vGrid.innerHTML += `
        <div class="bg-gray-50 rounded-xl p-3 cursor-pointer border border-gray-100 hover:border-indigo-300"
             onclick="location.href='/product?id=${v.productId}'">
          <div class="text-3xl mb-2">📦</div>
          <p class="text-sm font-semibold text-gray-800 line-clamp-2">${v.productName}</p>
          <p class="text-xs text-indigo-700 font-bold mt-1">${price}đ</p>
          <p class="text-xs text-gray-400 mt-1">${date}</p>
        </div>`;
    });
  }

  // Recommend grid
  if (!recs.length) {
    document.getElementById('recommendEmpty').classList.remove('hidden');
  } else {
    const rGrid = document.getElementById('recommendGrid');
    recs.forEach(p => {
      const price = Number(p.priceVND).toLocaleString('vi-VN');
      rGrid.innerHTML += `
        <div class="bg-gray-50 rounded-xl overflow-hidden cursor-pointer border border-gray-100 hover:border-indigo-300"
             onclick="location.href='/product?id=${p.productId}'">
          <div class="bg-gradient-to-br from-indigo-50 to-blue-100 h-24 flex items-center justify-center text-4xl">
            ${emoji(p.categoryName)}
          </div>
          <div class="p-2.5">
            <p class="text-xs text-indigo-500 truncate">${p.categoryName||''}</p>
            <p class="text-xs font-semibold text-gray-800 line-clamp-2 mt-0.5">${p.productName}</p>
            <p class="text-indigo-700 font-bold text-xs mt-1">${price}đ</p>
            <span class="inline-block mt-1 text-xs bg-green-100 text-green-700 px-2 py-0.5 rounded-full">
              ${p.supportCount} người ủng hộ
            </span>
          </div>
        </div>`;
    });
  }
}

function showTab(name) {
  ['bought','viewed','recommend'].forEach(t => {
    document.getElementById(`tab-${t}`).classList.add('hidden');
    document.getElementById(`tab-btn-${t}`).className = 'tab-btn px-5 py-3 text-sm text-gray-500 border-b-2 border-transparent';
  });
  document.getElementById(`tab-${name}`).classList.remove('hidden');
  document.getElementById(`tab-btn-${name}`).className = 'tab-btn px-5 py-3 text-sm border-b-2 border-indigo-600 text-indigo-700 font-bold';
}

boot();
</script>
</body>
</html>
