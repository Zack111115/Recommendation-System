<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Đăng nhập – ShopNeo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
  <style>
    body { background: linear-gradient(135deg,#4338ca 0%,#6366f1 60%,#818cf8 100%); }
    .card { animation: slideUp .35s ease; }
    @keyframes slideUp { from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)} }
    input:focus { outline:none; border-color:#6366f1; box-shadow:0 0 0 3px rgba(99,102,241,.15); }
    .shake { animation: shake .4s; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      20%,60%{transform:translateX(-6px)}
      40%,80%{transform:translateX(6px)}
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

<div class="card bg-white rounded-2xl shadow-2xl w-full max-w-sm overflow-hidden">
  <!-- Header -->
  <div class="bg-indigo-700 px-8 py-7 text-white text-center">
    <div class="text-5xl mb-3"><i class="fa-solid fa-store"></i></div>
    <h1 class="text-2xl font-bold">ShopNeo</h1>
    <p class="text-indigo-200 text-sm mt-1">Hệ Thống Gợi Ý Sản Phẩm</p>
  </div>

  <div class="px-8 py-7">
    <h2 class="text-lg font-bold text-gray-800 mb-5 text-center">Đăng nhập tài khoản</h2>

    <!-- Username -->
    <div class="mb-4">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">
        <i class="fa fa-user text-indigo-500 mr-1"></i> Tên đăng nhập
      </label>
      <input id="username" type="text" placeholder="Ví dụ: C001, C002, C010..."
             autocomplete="username"
             class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm transition"/>
      <p class="text-xs text-gray-400 mt-1">
        <i class="fa fa-info-circle mr-1"></i>Định dạng: <strong>C</strong> + số thứ tự (C001 → C060)
      </p>
    </div>

    <!-- Password -->
    <div class="mb-5">
      <label class="block text-sm font-medium text-gray-700 mb-1.5">
        <i class="fa fa-lock text-indigo-500 mr-1"></i> Mật khẩu
      </label>
      <div class="relative">
        <input id="password" type="password" placeholder="Nhập mật khẩu"
               autocomplete="current-password"
               class="w-full border border-gray-300 rounded-xl px-4 py-3 text-sm transition pr-10"/>
        <button type="button" onclick="togglePw()"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600 text-sm">
          <i id="eyeIcon" class="fa fa-eye"></i>
        </button>
      </div>
      <p class="text-xs text-gray-400 mt-1">
        <i class="fa fa-info-circle mr-1"></i>Mật khẩu mặc định: <strong>123</strong>
      </p>
    </div>

    <!-- Error -->
    <div id="errMsg" class="hidden mb-4 bg-red-50 border border-red-200 text-red-600 text-sm rounded-xl px-4 py-2.5 flex items-center gap-2">
      <i class="fa fa-exclamation-circle"></i>
      <span id="errText"></span>
    </div>

    <!-- Login button -->
    <button id="loginBtn" onclick="doLogin()"
      class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-bold py-3 rounded-xl transition text-sm flex items-center justify-center gap-2">
      <i class="fa fa-sign-in-alt"></i> Đăng nhập
    </button>

    <!-- Guest -->
    <button onclick="loginGuest()"
      class="w-full mt-3 border border-gray-200 hover:bg-gray-50 text-gray-500 text-sm py-2.5 rounded-xl transition">
      Tiếp tục xem mà không đăng nhập
    </button>
  </div>
</div>

<script>
const FIXED_PASSWORD = '123';
const API = '';

// Nếu đã đăng nhập, về trang chủ
if (sessionStorage.getItem('customerId')) {
  location.href = new URLSearchParams(location.search).get('next') || '/';
}

// Enter để đăng nhập
document.getElementById('password').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});
document.getElementById('username').addEventListener('keydown', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});

function togglePw() {
  const inp = document.getElementById('password');
  const icon = document.getElementById('eyeIcon');
  if (inp.type === 'password') { inp.type='text'; icon.className='fa fa-eye-slash'; }
  else { inp.type='password'; icon.className='fa fa-eye'; }
}

async function doLogin() {
  const raw = document.getElementById('username').value.trim();
  const pw  = document.getElementById('password').value;
  hideErr();

  // Validate
  if (!raw) { showErr('Vui lòng nhập tên đăng nhập.'); return; }
  if (!pw)  { showErr('Vui lòng nhập mật khẩu.'); return; }
  if (pw !== FIXED_PASSWORD) { showErr('Mật khẩu không đúng. Mật khẩu mặc định là: 123'); shake(); return; }

  // Chuẩn hóa ID (C1 → C001, c001 → C001)
  let customerId = raw.toUpperCase();
  if (/^C\d+$/.test(customerId)) {
    const num = parseInt(customerId.slice(1));
    customerId = 'C' + String(num).padStart(3, '0');
  }

  // Kiểm tra KH có tồn tại không
  const btn = document.getElementById('loginBtn');
  btn.innerHTML = '<i class="fa fa-spinner fa-spin mr-2"></i>Đang xác thực...';
  btn.disabled = true;

  try {
    const res = await fetch(`${API}/api/customers/${customerId}`);
    if (!res.ok) {
      showErr(`Không tìm thấy tài khoản "${customerId}". Kiểm tra lại tên đăng nhập.`);
      shake();
    } else {
      const cust = await res.json();
      sessionStorage.setItem('customerId',   cust.id);
      sessionStorage.setItem('customerName', cust.name || cust.id);
      const next = new URLSearchParams(location.search).get('next') || '/';
      location.href = next;
    }
  } catch {
    showErr('Lỗi kết nối. Hãy đảm bảo Neo4j và server đang chạy.');
  } finally {
    btn.innerHTML = '<i class="fa fa-sign-in-alt mr-2"></i>Đăng nhập';
    btn.disabled = false;
  }
}

function loginGuest() {
  sessionStorage.removeItem('customerId');
  sessionStorage.removeItem('customerName');
  location.href = '/';
}

function showErr(msg) {
  document.getElementById('errText').textContent = msg;
  document.getElementById('errMsg').classList.remove('hidden');
}
function hideErr() {
  document.getElementById('errMsg').classList.add('hidden');
}
function shake() {
  const card = document.querySelector('.card');
  card.classList.add('shake');
  setTimeout(() => card.classList.remove('shake'), 500);
}
</script>
</body>
</html>
